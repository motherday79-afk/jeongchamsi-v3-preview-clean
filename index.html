<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" id="jcv3-viewport">
  <script>
    try {
      const mobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");
      const touch = navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
      const shortSide = Math.min(Number(screen.width || 9999), Number(screen.height || 9999));
      if (mobileUA || (touch && shortSide <= 1024)) document.documentElement.classList.add("jcv3-touch-ui");
      localStorage.removeItem("jcv3:view-mode");
      document.documentElement.classList.remove("jcv3-force-desktop");
    } catch {}
  </script>
  <meta name="theme-color" content="#18242a">
  <title>정참시 — 정치에 참여할 시간</title>
  <link rel="stylesheet" href="/css/app.css?v=alpha6.0.36.24-showcase-hero-now">
  <link rel="stylesheet" href="/css/pages.css?v=alpha6.0.36.31-photo-chain-rootfix">
  <link rel="stylesheet" href="/css/product-system.css?v=alpha6.0.36.24-showcase-hero-now">
  <link rel="stylesheet" href="/css/spectrum-palette.css?v=alpha6.0.36.24-showcase-hero-now">
  <link rel="stylesheet" href="/css/mobile-foundation.css?v=alpha6.0.36.26-mobile-foundation" media="(max-width: 1024px)">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.js?v=alpha6.0.36.31-photo-chain-rootfix"></script>
</body>
</html>
